# TEMPLATE ONLY: never commit real values. Create the real Secret from the command line instead:
#
#   kubectl -n student-predictor create secret generic spp-secrets \
#     --from-literal=MONGODB_URI='mongodb+srv://USER:PASSWORD@YOUR-CLUSTER.mongodb.net/' \
#     --from-literal=ADMIN_PASSWORD='choose-a-strong-one'
#
# Kubernetes Secrets are only base64-encoded, not encrypted: in a real cluster enable encryption at rest
# or use an external secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: spp-secrets
  namespace: student-predictor
type: Opaque
stringData:
  MONGODB_URI: "<set with kubectl create secret, see above>"
  ADMIN_PASSWORD: "<set with kubectl create secret, see above>"
