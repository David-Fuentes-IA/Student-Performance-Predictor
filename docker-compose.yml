# One command brings up the whole system:   docker compose up --build   ->  http://localhost:8000
#
#   app    the Flask application (dashboard at /, administration at /admin)
#   mongo  a private MongoDB with a persistent volume (data survive `docker compose down`;
#          `docker compose down -v` deletes them)
#   mailpit (optional, for demos) a local mail catcher: e-mail alerts appear at http://localhost:8025 and never
#          leave the machine. Start it with   docker compose --profile mail up -d   and set in .env:
#          ALERT_EMAIL_TO=errores@demo.local  SMTP_HOST=mailpit  SMTP_PORT=1025  SMTP_STARTTLS=false
#
# Configuration comes from environment variables or a `.env` file next to this file.
# To use MongoDB Atlas instead of the bundled database, set DOCKER_MONGODB_URI (see README) and run
#   docker compose up --build --no-deps app

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: student-performance-predictor:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # A separate variable from MONGODB_URI on purpose: a developer's .env usually points to
      # "localhost", which inside a container would be the container itself.
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-student_predictor}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RISK_THRESHOLD: ${RISK_THRESHOLD:-75}
      PASSING_GRADE: ${PASSING_GRADE:-60}
      SEED_DEMO: ${SEED_DEMO:-true}
      # E-mail alerts for real failures (off unless ALERT_EMAIL_TO and SMTP_HOST are set; see core/email_alerts.py).
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]          # only with --profile mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web inbox, reachable only from this computer

volumes:
  mongo_data:
